name: Cadre
description: Cadre is a New York-based, technology-driven investment platform that gives individual
  and institutional investors access to private-market alternatives, historically centered on
  institutional-quality commercial real estate. Founded in 2014 and backed by investors including
  Andreessen Horowitz, Thrive Capital, and Slow Ventures, Cadre now operates in partnership with
  Willow Wealth (Willow Wealth Markets LLC, a FINRA/SIPC broker-dealer formerly known as RealCadre LLC,
  and Willow Asset Management LLC, an SEC-registered investment adviser) to offer diversified
  private-market funds alongside traditional stocks and bonds. This is a company profile in the API
  Evangelist network; Cadre does not currently publish a public API, developer portal, or SDKs.
